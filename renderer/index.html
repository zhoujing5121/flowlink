.flows th,.flows td{box-sizing:border-box}
.flows td,.flows td.action-cell{padding-top:8px;padding-bottom:8px}


/* Profile sections use CoQ type, controls and spacing. */
#profilePanel .profile-basic-grid{gap:24px 16px}
#profilePanel .profile-service-field{max-width:calc((100% - 16px)/2)}
#profilePanel .version-management{margin-top:48px}
.version-management-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:8px 16px;border-bottom:1px solid #D7DEE7;background:#fff;font-size:16px;line-height:24px;font-weight:400}
.version-name{min-width:0;flex:1}
.version-status-field{position:relative;width:192px;flex:0 0 192px}
.version-status-field select{appearance:none;display:block;width:100%;height:48px;padding:0 48px 0 16px;background:#EFF1F2;border:0;border-bottom:1px solid #A4AEB7;font-family:inherit;font-size:16px;line-height:24px;font-weight:400;letter-spacing:normal;cursor:pointer}
.version-status-field svg{position:absolute;right:12px;top:12px;width:24px;height:24px;pointer-events:none;fill:none;stroke:#595E62;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.version-status-field select:focus-visible{outline:1px solid #007BC0;outline-offset:0}
@media(max-width:950px){#profilePanel .profile-service-field{max-width:none}}


/* Sidebar identity and fixed lower information area. */
.nav-collapse-icon{display:none}
.expanded .nav-menu-icon{display:none}
.expanded .nav-collapse-icon{display:block}
.nav-bottom{height:auto;min-height:96px;flex:0 0 auto;padding:0;color:#D8DBDE}
.nav-bottom-item{height:48px;min-height:48px;display:flex;align-items:center;gap:16px;padding:0 16px;font-size:16px;line-height:24px;font-weight:400;white-space:nowrap}
.nav-bottom-icon{width:24px;height:24px;flex:0 0 24px;display:flex;align-items:center;justify-content:center}
.nav-bottom-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-bottom-label,.nav-version{display:none}
.expanded .nav-bottom-item{padding:0 24px}
.expanded .nav-bottom-label{display:block}
.expanded .nav-version{display:flex;align-items:center;min-height:32px;padding:0 24px;border-top:1px solid #45484B;color:#ABB2B9;font-size:12px;line-height:18px}


/* Profile: four Service Level controls and a full-row version selector. */
#profilePanel .profile-service-field{max-width:none}
.service-line-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.service-line-control{display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:24px;font-weight:400}
.required-marker{color:#D50000}
.service-line-select{position:relative}
.service-line-select select{appearance:none;width:100%;height:48px;padding:0 48px 0 16px;background:#EFF1F2;border:0;border-bottom:1px solid #A4AEB7;font-family:inherit;font-size:16px;line-height:24px;letter-spacing:normal}
.service-line-select svg{position:absolute;right:12px;top:12px;width:24px;height:24px;pointer-events:none;fill:none;stroke:#595E62;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.version-management-row{position:relative;min-height:48px;padding:0;border:0;margin-bottom:16px}
.version-name{position:absolute;left:16px;top:12px;pointer-events:none;z-index:1}
.version-status-field{width:100%;flex:1}
.version-status-field select{text-align:right;padding-left:96px}
.flow-description{max-width:760px}
.drawer-tabs{position:relative;border-bottom:0}
.drawer-tabs:after{content:'';position:absolute;left:24px;right:24px;bottom:0;height:1px;background:var(--line)}
@media(max-width:671px){.service-line-grid{grid-template-columns:1fr}}


/* Shared design contracts: spacing is measured between visible content edges. */
:root{--space-control:8px;--space-group:16px;--action-width:104px;--action-height:48px;--content-inset:16px}
body{color:#000000;line-height:24px}
body .btn{box-sizing:border-box;width:var(--action-width)!important;min-width:var(--action-width)!important;max-width:var(--action-width)!important;height:var(--action-height)!important;min-height:var(--action-height)!important;flex:0 0 var(--action-width)!important;padding:0 var(--space-control);font-size:16px;line-height:24px;font-weight:400;letter-spacing:normal}
.query-actions,.recording-actions,.drawer-footer,.reference-footer,.summary-dialog-actions,.action-confirm-buttons{gap:var(--space-control)}
#profilePanel{display:flex;flex-direction:column;gap:var(--space-group)}
#profilePanel[hidden]{display:none}
#profilePanel .form-section{margin:0}
#profilePanel .profile-basic-grid{gap:var(--space-group)}
#profilePanel .form-section h3{margin:0 0 var(--space-group)}
#profilePanel .version-management-row{margin:0}
#versionManagementRows{display:flex;flex-direction:column;gap:var(--space-group)}
.required-marker{color:#ED0007}
.flow-status-dot{width:8px;height:8px;flex-basis:8px}
.flow-enabled.deactive .flow-status-dot{background:#979EA4}
/* Tabs and instruction headings use the same 16px inner content edge. */
#designPanel .summary-tabs{padding:0 var(--content-inset) 8px;gap:var(--space-group);height:57px;min-height:57px;flex:0 0 57px;align-items:flex-start}
#designPanel .summary-tabs .tab{padding:0;height:48px;flex:0 0 auto;line-height:24px}
#designPanel .summary-tabs .tab[aria-selected=true]:after{left:-8px;right:-8px;bottom:0;height:2px}
#designPanel .summary-result-content{padding-top:var(--space-group)}
#designPanel .summary-result-content.process-active{padding:0}
#designPanel .instruction-group-heading{padding:0 var(--content-inset)}
#designPanel .instruction-row{padding:0 var(--content-inset)}
#designPanel .instruction-expand{width:104px;min-width:104px;height:48px;padding:0;justify-content:flex-end;gap:8px;flex:0 0 104px}
.pagination,.page-controls,.page-current span,.page-controls input{font-size:16px;line-height:24px;font-weight:400}
.page-controls{gap:0;align-items:center}
.page-controls label{margin:0 8px 0 0}
.page-word{margin:0 0 0 8px}
.footer-right{justify-content:flex-end}
/* Keep the last arrow's visible edge on the footer and table content line. */
.pagination{padding-right:calc(var(--frame) - 16px)}
.flows tbody td,.flows tbody td.action-cell{height:56px;padding-top:0;padding-bottom:0}



/* Query contract: shared 9/1/2 track, fixed actions, compact 48px fields. */
#query{display:grid;grid-template-columns:minmax(0,9fr) minmax(32px,1fr) minmax(328px,2fr);gap:0;align-items:start}
#query .query-fields{grid-column:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-right:16px;border-right:1px solid #979EA4;min-height:48px;flex-basis:auto}
#query .query-fields:after{display:none}
#query .query-field{height:48px;min-height:48px;position:relative;padding:0 8px;border-bottom:1px solid #000000}
#query .query-field>input,#query .query-select{height:29px;line-height:24px}
#query .query-actions{grid-column:3;justify-content:flex-end;align-items:flex-start;gap:8px;min-width:328px}
#query .query-expand{background:transparent;border-color:transparent;color:#007BC0;gap:8px;text-decoration:none}
#query .query-expand:disabled{color:#BFC0C2;background:transparent;border-color:transparent}
.query-expand svg{width:16px;height:16px;flex:0 0 16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#query input:focus,#query input:focus-visible,#query .query-select:focus,#query .query-select:focus-visible{outline:0;box-shadow:none;border-bottom-color:#000000}
#query .query-field:focus-within{border-bottom:1px solid #000000;box-shadow:none}
@media(max-width:671px){#query{grid-template-columns:minmax(0,1fr);gap:16px}#query .query-fields{grid-column:1;border:0;padding-right:0;grid-template-columns:repeat(2,minmax(0,1fr))}#query .query-actions{grid-column:1;min-width:0}}
/* Profile: paired fields retain the established section layout. */
#profilePanel .profile-basic-grid{gap:16px}
#profilePanel .service-line-control{gap:16px}
#profilePanel .service-line-select input{display:block;width:100%;height:48px;padding:0 16px;background:#EFF1F2;border:0;border-bottom:1px solid #000000;color:#000000;font:400 16px/24px 'Bosch Sans Global','Open Sans','Segoe UI',Arial,sans-serif}
#profilePanel input,#profilePanel select{border-bottom:1px solid #000000;color:#000000}
#profilePanel input:focus,#profilePanel input:focus-visible,#profilePanel select:focus,#profilePanel select:focus-visible{outline:0;box-shadow:none;border-bottom:1px solid #000000}
#profilePanel input::placeholder{color:#595E62;opacity:1}
#profilePanel .version-management-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:16px;min-height:0;background:transparent}
#profilePanel .version-status-field{width:100%;flex:0 0 auto}
#profilePanel .version-status-field select{text-align:left;padding:0 56px 0 16px}
#profilePanel .version-status-field svg,#profilePanel .service-line-select svg{right:16px}
#profilePanel .version-value-field input{background:#EFF1F2}
@media(max-width:671px){#profilePanel .version-management-row{grid-template-columns:minmax(0,1fr)}}

#profilePanel .service-line-select select:invalid{color:#595E62}

/* Metric opt-in layout follows the supplied two-group reference. */
#designPanel .summary-result-content.metric-active{display:flex;flex-direction:column;overflow:auto;padding:16px 0}
.metric-consent{display:flex;flex-direction:column;flex:1;min-height:0;padding:0 0 0 16px}
.metric-consent-groups{display:flex;flex-direction:column;gap:16px}
.metric-consent-group{display:block;border:0;padding:0;margin:0;min-width:0}
.metric-consent-group legend{display:block;width:100%;padding:0;margin:0 0 8px;font-size:16px;line-height:24px;font-weight:400;color:#000000}
.metric-consent-row{min-height:40px;padding:8px 0;display:flex;align-items:center;gap:8px;border-bottom:1px solid #D7DEE7;font-size:16px;line-height:24px;font-weight:400;cursor:pointer}
.metric-consent-footer{display:flex;align-items:center;justify-content:flex-end;gap:16px;margin-top:auto;padding-top:16px}
#metricConsentStatus{margin-right:auto;font-size:16px;line-height:24px;color:#525F6B}
#profileSaveStatus{margin-right:auto;font-size:16px;line-height:24px;color:#525F6B}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

/* Filter expansion occupies only the left region; query actions never move. */
#query #categoryField{grid-column:2/-1}
#query .advanced-filters{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
#query .advanced-filters[hidden]{display:none}
#query .query-expand{position:relative}
#query .query-expand[aria-expanded=true] svg{transform:rotate(180deg)}
#query .query-expand[data-active-count]:not([data-active-count=""]):after{content:attr(data-active-count);position:absolute;right:0;top:0;color:#007BC0;font-size:12px;line-height:16px}
#query .query-expand:hover{color:#00629A;background:transparent;border-color:transparent}
/* Every application Tab uses 16px inner sides, no extra list gap, and one 48px target. */
.status-tabs,.drawer-tabs,#designPanel .summary-tabs{gap:0}
.tab,#designPanel .summary-tabs .tab{height:48px;min-height:48px;padding:0 16px;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:24px;font-weight:400;letter-spacing:normal;flex:0 0 auto;margin:0}
#designPanel .summary-tabs{padding:0 0 8px}
.tab[aria-selected=true]:after,#designPanel .summary-tabs .tab[aria-selected=true]:after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:2px;background:#007BC0;z-index:1}
/* Metric groups share one vertical rhythm: 16px sections and 48px rows. */
.metric-consent-groups{gap:16px}
.metric-consent-group{display:flex;flex-direction:column;gap:16px;padding:0;margin:0;border:0}
.metric-consent-group h3{height:24px;margin:0;padding:0;font-size:16px;line-height:24px;font-weight:400;color:#000000}
.metric-consent-options{display:flex;flex-direction:column;gap:0}
.metric-consent-row{height:48px;min-height:48px;box-sizing:border-box;padding:0;margin:0;gap:8px;align-items:center}
.metric-consent-footer{gap:8px;padding-top:16px}
@media(max-width:671px){#query #categoryField{grid-column:2}#query .advanced-filters{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* Exact action-state palette from Design Standard 8.4.3. */
:root{--action-primary:#007BC0;--action-hover:#00629A;--action-pressed:#004975;--action-secondary-hover:#D1E4FF;--action-secondary-pressed:#9DC9FF;--action-disabled-surface:#F1F3F5;--action-disabled-border:#DEE2E6;--action-disabled-text:#ADB5BD;--text-primary:#000000;--text-secondary:#525F6B;--text-placeholder:#595E62}
body .btn:not(.query-expand){background:var(--action-primary);border-color:var(--action-primary);color:#FFFFFF;opacity:1}
body .btn:not(.query-expand):hover:not(:disabled){background:var(--action-hover);border-color:var(--action-hover);color:#FFFFFF}
body .btn:not(.query-expand):active:not(:disabled){background:var(--action-pressed);border-color:var(--action-pressed);color:#FFFFFF}
body .btn.secondary{background:#FFFFFF;border-color:var(--action-primary);color:var(--action-primary)}
body .btn.secondary:hover:not(:disabled){background:var(--action-secondary-hover);border-color:var(--action-hover);color:var(--action-hover)}
body .btn.secondary:active:not(:disabled){background:var(--action-secondary-pressed);border-color:var(--action-pressed);color:var(--action-pressed)}
body .btn:not(.query-expand):disabled,body .btn.secondary:disabled{background:var(--action-disabled-surface);border-color:var(--action-disabled-border);color:var(--action-disabled-text);cursor:not-allowed;opacity:1}
#query .query-expand,#query .query-expand:hover:not(:disabled){background:transparent;border-color:transparent;color:var(--action-primary)}
#query .query-expand:active:not(:disabled){background:transparent;border-color:transparent;color:var(--action-hover)}
#query .query-expand:disabled{background:var(--action-disabled-surface);border-color:var(--action-disabled-border);color:var(--action-disabled-text);cursor:not-allowed;opacity:1}
#profilePanel .form-section h3,#designPanel .recording-row-name,#designPanel .reference-table,#designPanel .reference-name,#designPanel .instruction-row,#designPanel .metric-consent{color:var(--text-primary)}
#designPanel .step-detail-fields label,#designPanel .canvas-group-heading{color:var(--text-secondary)}
/* Row actions are blue when available; disabled icons use their component state. */
.flows .row-actions .icon-button:not(:disabled),#designPanel .reference-row-actions .icon-button:not(:disabled),#designPanel .recording-delete:not(:disabled){color:var(--action-primary)}
.flows .row-actions .icon-button:disabled,#designPanel .reference-row-actions .icon-button:disabled,#designPanel .recording-delete:disabled{color:var(--action-disabled-text);opacity:1}

 if(!m)return null;
 if(/^\d+$/.test(m[1]))return Number(m[1])-1;
 const digits={'零':0,'〇':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
 const parts=m[1].split('十');const n=parts.length===2?(parts[0]?digits[parts[0]]:1)*10+(parts[1]?digits[parts[1]]:0):digits[m[1]];

  try{
   const flow=await F.flow.load(item.flowFile);

function finishGroupRecording(state,pending,item){

  ?pending.recordedSteps
  :pending.actions.map(action=>action.type==='input'?`在【${action.target}】中填写：${action.value}`:action.type==='click'?`点击【${action.target}】`:action.type==='navigate'?`打开 ${action.url}`:'').filter(Boolean);
 if(steps.length){
  ensureStepDetails(item);
  let position;
  if(pending.groupMode==='replace'){
   position=group.start;
   item.steps.splice(group.start,group.count,...steps);
   item.stepDetails.splice(group.start,group.count,...(pending.recordedDetails||item.stepDetails.slice(group.start,group.start+group.count)));
  }else{
   const after=pending.groupMode==='after';
   position=group.start+(after?group.count:0);
   item.steps.splice(position,0,...steps);
   item.stepDetails.splice(position,0,...(pending.recordedDetails||steps.map(text=>({type:'click',target:'',value:'',tab:1}))));
  }
  if(pending.media){
   const oldScreenshots=item.media?.screenshots||[];
   const newScreenshots=pending.media.screenshots||[];
   const spliceCount=pending.groupMode==='replace'?group.count:0;
   const updated=[...oldScreenshots.slice(0,position),...newScreenshots,...oldScreenshots.slice(position+spliceCount)];
   const finalScreenshots=updated.slice(0,item.steps.length);
   while(finalScreenshots.length<item.steps.length){
    finalScreenshots.push({image:'',name:`Screenshot-${String(finalScreenshots.length+1).padStart(2,'0')}.png`});
   }

  }
  item.processGroups=buildTabGroupsForItem(item);
  const enriched=ensureProcessGroups(item);
  const selected=enriched.find(g=>g.start<=position&&position<g.start+g.count);
  item.selectedGroup=selected?.id||enriched[0]?.id||null;
  item.nodeUpdates=true;
 }

 const refresh=()=>{if(getComputedStyle(separator).display==='none')return;const width=state.listWidth??layout.querySelector('.recording-list').getBoundingClientRect().width;setWorkspaceWidth(width);};
 workspaceResizeObserver=new ResizeObserver(refresh);workspaceResizeObserver.observe(layout);refresh();
 separator.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();separator.setPointerCapture(e.pointerId);document.body.classList.add('workspace-resizing');};
 separator.onpointermove=e=>{if(separator.hasPointerCapture(e.pointerId))setWorkspaceWidth(e.clientX-layout.getBoundingClientRect().left);};
 const finish=e=>{if(separator.hasPointerCapture(e.pointerId))separator.releasePointerCapture(e.pointerId);document.body.classList.remove('workspace-resizing');};
 separator.onpointerup=finish;separator.onpointercancel=finish;
 separator.onkeydown=e=>{const current=layout.querySelector('.recording-list').getBoundingClientRect().width,limits=workspaceWidthBounds(layout);let next;if(e.key==='ArrowLeft')next=current-24;else if(e.key==='ArrowRight')next=current+24;else if(e.key==='Home')next=limits.min;else if(e.key==='End')next=limits.max;else return;e.preventDefault();setWorkspaceWidth(next);};
}
function assistantWidthBounds(){return {min:Math.min(260,Math.max(180,innerWidth*.35)),max:Math.max(260,Math.min(640,innerWidth-48-700))};}
function setAssistantWidth(value){
 const bounds=assistantWidthBounds(),width=Math.max(bounds.min,Math.min(bounds.max,value));recordingSession().aiWidth=width;$('drawer').style.setProperty('--assistant-width',width+'px');
 const separator=$('assistantResize');separator.setAttribute('aria-valuemin',String(Math.round(bounds.min)));separator.setAttribute('aria-valuemax',String(Math.round(bounds.max)));separator.setAttribute('aria-valuenow',String(Math.round(width)));
}
function bindAssistantResize(){
 const separator=$('assistantResize');setAssistantWidth(recordingSession().aiWidth||320);
 separator.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();separator.setPointerCapture(e.pointerId);document.body.classList.add('workspace-resizing');};
 separator.onpointermove=e=>{if(separator.hasPointerCapture(e.pointerId))setAssistantWidth($('recordingAssistant').getBoundingClientRect().right-e.clientX);};
 const finish=e=>{if(separator.hasPointerCapture(e.pointerId))separator.releasePointerCapture(e.pointerId);document.body.classList.remove('workspace-resizing');};
 separator.onpointerup=finish;separator.onpointercancel=finish;
 separator.onkeydown=e=>{let value=recordingSession().aiWidth||320;const bounds=assistantWidthBounds();if(e.key==='ArrowLeft')value+=24;else if(e.key==='ArrowRight')value-=24;else if(e.key==='Home')value=bounds.min;else if(e.key==='End')value=bounds.max;else return;e.preventDefault();setAssistantWidth(value);};
}

render();
</script>
