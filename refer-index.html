/* Sidebar identity and fixed lower information area. */
.nav-collapse-icon{display:none}
.expanded .nav-menu-icon{display:none}

.nav-bottom{height:auto;min-height:96px;flex:0 0 auto;padding:0;color:#D8DBDE}
.nav-bottom-item{height:48px;min-height:48px;display:flex;align-items:center;gap:16px;padding:0 16px;font-size:16px;line-height:24px;font-weight:400;white-space:nowrap}
.nav-bottom-icon{width:24px;height:24px;flex:0 0 24px;display:flex;align-items:center;justify-content:center}
.nav-bottom-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-bottom-label,.nav-version{display:none}
.expanded .nav-bottom-item{padding:0 24px}
.expanded .nav-bottom-label{display:block}
.expanded .nav-version{display:flex;align-items:center;min-height:32px;padding:0 24px;border-top:1px solid #45484B;color:#ABB2B9;font-size:12px;line-height:18px}


/* Profile: four Service Level controls and a full-row version selector. */
#profilePanel .profile-service-field{max-width:none}
.service-line-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.service-line-control{display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:24px;font-weight:400}
.required-marker{color:#D50000}
.service-line-select{position:relative}
.service-line-select select{appearance:none;width:100%;height:48px;padding:0 48px 0 16px;background:#EFF1F2;border:0;border-bottom:1px solid #A4AEB7;font-family:inherit;font-size:16px;line-height:24px;letter-spacing:normal}
.service-line-select svg{position:absolute;right:12px;top:12px;width:24px;height:24px;pointer-events:none;fill:none;stroke:#595E62;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.version-management-row{position:relative;min-height:48px;padding:0;border:0;margin-bottom:16px}
.version-name{position:absolute;left:16px;top:12px;pointer-events:none;z-index:1}
.version-status-field{width:100%;flex:1}
.version-status-field select{text-align:right;padding-left:96px}
.flow-description{max-width:760px}
.drawer-tabs{position:relative;border-bottom:0}

/* Shared design contracts: spacing is measured between visible content edges. */
:root{--space-control:8px;--space-group:16px;--action-width:104px;--action-height:48px;--content-inset:16px}
body{color:#000000;line-height:24px}
body .btn{box-sizing:border-box;width:var(--action-width)!important;min-width:var(--action-width)!important;max-width:var(--action-width)!important;height:var(--action-height)!important;min-height:var(--action-height)!important;flex:0 0 var(--action-width)!important;padding:0 var(--space-control);font-size:16px;line-height:24px;font-weight:400;letter-spacing:normal}
.query-actions,.recording-actions,.drawer-footer,.reference-footer,.summary-dialog-actions,.action-confirm-buttons{gap:var(--space-control)}
#profilePanel{display:flex;flex-direction:column;gap:var(--space-group)}
#profilePanel[hidden]{display:none}
#profilePanel .form-section{margin:0}
#profilePanel .profile-basic-grid{gap:var(--space-group)}
#profilePanel .form-section h3{margin:0 0 var(--space-group)}
#profilePanel .version-management-row{margin:0}
#versionManagementRows{display:flex;flex-direction:column;gap:var(--space-group)}
.required-marker{color:#ED0007}
.flow-status-dot{width:8px;height:8px;flex-basis:8px}
.flow-enabled.deactive .flow-status-dot{background:#979EA4}
/* Tabs and instruction headings use the same 16px inner content edge. */
#designPanel .summary-tabs{padding:0 var(--content-inset) 8px;gap:var(--space-group);height:57px;min-height:57px;flex:0 0 57px;align-items:flex-start}
#designPanel .summary-tabs .tab{padding:0;height:48px;flex:0 0 auto;line-height:24px}
#designPanel .summary-tabs .tab[aria-selected=true]:after{left:-8px;right:-8px;bottom:0;height:2px}
#designPanel .summary-result-content{padding-top:var(--space-group)}
#designPanel .summary-result-content.process-active{padding:0}
#designPanel .instruction-group-heading{padding:0 var(--content-inset)}
#designPanel .instruction-row{padding:0 var(--content-inset)}
#designPanel .instruction-expand{width:104px;min-width:104px;height:48px;padding:0;justify-content:flex-end;gap:8px;flex:0 0 104px}
.pagination,.page-controls,.page-current span,.page-controls input{font-size:16px;line-height:24px;font-weight:400}
.page-controls{gap:0;align-items:center}
.page-controls label{margin:0 8px 0 0}
.page-word{margin:0 0 0 8px}
.footer-right{justify-content:flex-end}
/* Keep the last arrow's visible edge on the footer and table content line. */
.pagination{padding-right:calc(var(--frame) - 16px)}
.flows tbody td,.flows tbody td.action-cell{height:56px;padding-top:0;padding-bottom:0}



/* Query contract: shared 9/1/2 track, fixed actions, compact 48px fields. */
#query{display:grid;grid-template-columns:minmax(0,9fr) minmax(32px,1fr) minmax(328px,2fr);gap:0;align-items:start}
#query .query-fields{grid-column:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-right:16px;border-right:1px solid #979EA4;min-height:48px;flex-basis:auto}
#query .query-fields:after{display:none}
#query .query-field{height:48px;min-height:48px;position:relative;padding:0 8px;border-bottom:1px solid #000000}
#query .query-field>input,#query .query-select{height:29px;line-height:24px}
#query .query-actions{grid-column:3;justify-content:flex-end;align-items:flex-start;gap:8px;min-width:328px}
#query .query-expand{background:transparent;border-color:transparent;color:#007BC0;gap:8px;text-decoration:none}
#query .query-expand:disabled{color:#BFC0C2;background:transparent;border-color:transparent}
.query-expand svg{width:16px;height:16px;flex:0 0 16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#query input:focus,#query input:focus-visible,#query .query-select:focus,#query .query-select:focus-visible{outline:0;box-shadow:none;border-bottom-color:#000000}
#query .query-field:focus-within{border-bottom:1px solid #000000;box-shadow:none}
@media(max-width:671px){#query{grid-template-columns:minmax(0,1fr);gap:16px}#query .query-fields{grid-column:1;border:0;padding-right:0;grid-template-columns:repeat(2,minmax(0,1fr))}#query .query-actions{grid-column:1;min-width:0}}
/* Profile: paired fields retain the established section layout. */
#profilePanel .profile-basic-grid{gap:16px}
#profilePanel .service-line-control{gap:16px}
#profilePanel .service-line-select input{display:block;width:100%;height:48px;padding:0 16px;background:#EFF1F2;border:0;border-bottom:1px solid #000000;color:#000000;font:400 16px/24px 'Bosch Sans Global','Open Sans','Segoe UI',Arial,sans-serif}
#profilePanel input,#profilePanel select{border-bottom:1px solid #000000;color:#000000}

#profilePanel .version-status-field svg,#profilePanel .service-line-select svg{right:16px}

#profilePanel .service-line-select select:invalid{color:#595E62}

/* Metric opt-in layout follows the supplied two-group reference. */
#designPanel .summary-result-content.metric-active{display:flex;flex-direction:column;overflow:auto;padding:16px 0}
.metric-consent{display:flex;flex-direction:column;flex:1;min-height:0;padding:0 0 0 16px}
.metric-consent-groups{display:flex;flex-direction:column;gap:16px}
.metric-consent-group{display:block;border:0;padding:0;margin:0;min-width:0}

.metric-consent-row{min-height:40px;padding:8px 0;display:flex;align-items:center;gap:8px;border-bottom:1px solid #D7DEE7;font-size:16px;line-height:24px;font-weight:400;cursor:pointer}
.metric-consent-footer{display:flex;align-items:center;justify-content:flex-end;gap:16px;margin-top:auto;padding-top:16px}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

/* Filter expansion occupies only the left region; query actions never move. */
#query #categoryField{grid-column:2/-1}

#query .advanced-filters[hidden]{display:none}

#query .query-expand:hover{color:#00629A;background:transparent;border-color:transparent}
/* Every application Tab uses 16px inner sides, no extra list gap, and one 48px target. */
.status-tabs,.drawer-tabs,#designPanel .summary-tabs{gap:0}
.tab,#designPanel .summary-tabs .tab{height:48px;min-height:48px;padding:0 16px;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:24px;font-weight:400;letter-spacing:normal;flex:0 0 auto;margin:0}

.tab[aria-selected=true]:after,#designPanel .summary-tabs .tab[aria-selected=true]:after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:2px;background:#007BC0;z-index:1}
/* Metric groups share one vertical rhythm: 16px sections and 48px rows. */
.metric-consent-groups{gap:16px}
.metric-consent-group{display:flex;flex-direction:column;gap:16px;padding:0;margin:0;border:0}

/* Exact action-state palette from Design Standard 8.4.3. */
:root{--action-primary:#007BC0;--action-hover:#00629A;--action-pressed:#004975;--action-secondary-hover:#D1E4FF;--action-secondary-pressed:#9DC9FF;--action-disabled-surface:#F1F3F5;--action-disabled-border:#DEE2E6;--action-disabled-text:#ADB5BD;--text-primary:#000000;--text-secondary:#525F6B;--text-placeholder:#595E62}
body .btn:not(.query-expand){background:var(--action-primary);border-color:var(--action-primary);color:#FFFFFF;opacity:1}
body .btn:not(.query-expand):hover:not(:disabled){background:var(--action-hover);border-color:var(--action-hover);color:#FFFFFF}
body .btn:not(.query-expand):active:not(:disabled){background:var(--action-pressed);border-color:var(--action-pressed);color:#FFFFFF}
body .btn.secondary{background:#FFFFFF;border-color:var(--action-primary);color:var(--action-primary)}
body .btn.secondary:hover:not(:disabled){background:var(--action-secondary-hover);border-color:var(--action-hover);color:var(--action-hover)}
body .btn.secondary:active:not(:disabled){background:var(--action-secondary-pressed);border-color:var(--action-pressed);color:var(--action-pressed)}
body .btn:not(.query-expand):disabled,body .btn.secondary:disabled{background:var(--action-disabled-surface);border-color:var(--action-disabled-border);color:var(--action-disabled-text);cursor:not-allowed;opacity:1}
#query .query-expand,#query .query-expand:hover:not(:disabled){background:transparent;border-color:transparent;color:var(--action-primary)}
#query .query-expand:active:not(:disabled){background:transparent;border-color:transparent;color:var(--action-hover)}
#query .query-expand:disabled{background:var(--action-disabled-surface);border-color:var(--action-disabled-border);color:var(--action-disabled-text);cursor:not-allowed;opacity:1}
#profilePanel .form-section h3,#designPanel .recording-row-name,#designPanel .reference-table,#designPanel .reference-name,#designPanel .instruction-row,#designPanel .metric-consent{color:var(--text-primary)}
#designPanel .step-detail-fields label,#designPanel .canvas-group-heading{color:var(--text-secondary)}
/* Row actions are blue when available; disabled icons use their component state. */

.flows .row-actions .icon-button:disabled,#designPanel .reference-row-actions .icon-button:disabled,#designPanel .recording-delete:disabled{color:var(--action-disabled-text);opacity:1}

/* V3.15 role mapping; project buttons remain 104×48. */
:root{--font-ui:'Bosch Sans Global','Open Sans',sans-serif;--space-unit:8px;--space-content:16px;--space-group:16px;--frame:16px;--content-inset:16px;--text-primary:#000000;--text-secondary:#525F6B;--text-placeholder:#595E62;--surface:#EFF1F2;--line:#D7DEE7;--query-line:#979EA4}
html,body{font-family:var(--font-ui);font-size:16px;line-height:24px;font-weight:400;letter-spacing:normal;color:var(--text-primary)}
button,input,select,textarea,table,summary{font-family:var(--font-ui);font-size:16px;line-height:24px;font-weight:400;letter-spacing:normal}
.main h1{font-size:24px;line-height:34px;font-weight:700;margin-bottom:16px}
.drawer-title{font-size:24px;line-height:36px;font-weight:700}
#drawer .form-section h3,#drawer .steps-group h3,#drawer .instruction-all-title,#drawer .metric-consent-group h3,.record-section-heading,.canvas-group-heading{font-family:var(--font-ui);font-size:16px;line-height:24px;font-weight:700;color:#000000}
.tab,#designPanel .summary-tabs .tab,.btn,.instruction-expand-all,.field-label,.service-line-control,.recording-select-all,.recording-row-name,.instruction-row,.step-row-text,#designPanel .canvas-step,.reference-table,.reference-name,.metric-consent-row,.test-run-media h4{font-family:var(--font-ui);font-size:16px;line-height:24px;font-weight:400;letter-spacing:normal}
.tab[aria-selected=true]{font-weight:400;color:#007BC0}
#query .query-label{font-size:12px;line-height:18px;font-weight:400;color:#000000}
#query .query-field>input,#query .query-select,#profilePanel input,#profilePanel select{font-family:var(--font-ui);font-size:16px;line-height:24px;font-weight:400}
.flows th,.reference-table th{font-size:16px;line-height:24px;font-weight:700;color:#000000;background:#EFF1F2}
.flows td,.reference-table td{font-size:16px;line-height:24px;font-weight:400;color:#000000}
#designPanel .canvas-group-heading{font-weight:700;color:#000000}
#designPanel .canvas-step{color:#000000;background:#F8F9FA;border-color:#D7DEE7}
.canvas-group{background:#FFFFFF;border-color:#D7DEE7;border-radius:0}
.canvas-group.selected{border-color:#007BC0;background:#E5F1FB}
.execution-mode-icon,.step-row-number{color:#525F6B}
#designPanel .step-detail-fields label{font-size:16px;line-height:24px;font-weight:400;color:#000000}
.step-detail-fields input,.step-detail-fields textarea{font:400 16px/24px var(--font-ui);color:#000000}
#drawer .assistant-header,#drawer .assistant-message,#drawer .assistant-step,#drawer .assistant-step-number,#drawer .assistant-group-name,#drawer .assistant-group-options>button{font-family:var(--font-ui);font-size:16px;line-height:24px;letter-spacing:normal;font-weight:400;color:#000000}
#drawer .assistant-header{font-weight:700}
#drawer .assistant-composer textarea{font:400 16px/24px var(--font-ui);color:#000000}
.recording-media-name,.recording-screenshot-file span{font-size:16px;line-height:24px;font-weight:400;color:#000000}
.recording-summary-status,.record-media-empty,.test-status,.test-demo-label,.test-progress-heading,.test-step,.test-step small,.test-error,#metricConsentStatus,#profileSaveStatus,.nav-version{font-size:12px;line-height:18px;font-weight:400}
.test-progress-heading strong{font-weight:700}
.test-step{color:#525F6B}.test-step.completed{color:#00884A}.test-step.running{color:#007BC0}.test-step.failed,.test-error{color:#ED0007}
.pagination,.page-controls,.page-current span,.page-controls input,.page-button{font:400 12px/18px var(--font-ui)}
input::placeholder,textarea::placeholder{color:#595E62;opacity:1}
#profilePanel .required-marker{color:#ED0007}
/* Global spacing: 16px between content groups, 8px within action groups. */
.main{padding-top:16px;padding-bottom:16px}.content-toolbar{margin-top:16px;margin-bottom:16px;gap:16px}
.drawer-head{padding-top:16px;padding-bottom:16px;gap:16px}.drawer-body{padding:16px}
.drawer-footer{padding:16px;gap:8px}
#profilePanel .form-section,#profilePanel .version-management{margin-top:0;margin-bottom:16px}
#profilePanel .form-section h3{margin:0 0 16px}
#profilePanel .profile-basic-grid,#profilePanel .service-line-grid,#profilePanel .service-line-control,#profilePanel .version-management-row{gap:16px}
.field{gap:16px}.field-label{margin-bottom:0}
.instruction-global-actions{min-height:64px;gap:16px;padding:0 16px 16px}
.instruction-all-title{margin:0}.instruction-expand-all{gap:8px}
#designPanel .steps-group{margin:0 0 16px}
#designPanel .instruction-group-heading{margin:0 0 16px;padding:0 16px;min-height:48px;gap:16px}
#designPanel .instruction-group-heading h3{margin:0}
#designPanel .instruction-row{padding:16px;min-height:56px;gap:16px}
#designPanel .step-detail-fields{padding:16px;gap:16px}
.step-field-grid{gap:16px}
#designPanel .metric-consent-groups,#designPanel .metric-consent-group{gap:16px}
.recording-media{gap:16px;padding:16px}.recording-media-name,.recording-screenshot-file span{padding:16px}
.recording-screenshots,.test-run-media{gap:16px}.test-run-media{margin-bottom:16px}
#drawer .assistant-header,#drawer .assistant-steps,#drawer .assistant-chat,#drawer .assistant-composer{padding-left:16px;padding-right:16px}
#drawer .assistant-steps{padding-top:16px;padding-bottom:16px}
#drawer .assistant-step{padding:8px 0;gap:8px;min-height:40px}
#drawer .assistant-message{margin-bottom:16px}.assistant-message.user{padding:8px 16px;background:#EFF1F2}
#drawer .assistant-composer{padding-top:16px;padding-bottom:0}
#drawer .assistant-input-box{border-color:#979EA4}.assistant-input-box:focus-within{border-color:#007BC0}
#drawer .assistant-composer textarea{padding:16px 48px 16px 16px;min-height:96px}
#drawer .assistant-group-options{padding-top:16px;gap:8px}
#drawer .assistant-group-options>button{padding:8px 16px;background:#E5F1FB}
.test-toolbar{padding:8px 16px;gap:8px}.test-browser-chrome{padding:8px;gap:8px}.test-status{padding:8px 16px}
/* Borders, 18px label lineboxes and 57px tab composites are geometry, not spacing tokens. */
.instruction-expand-all{padding:0}
#designPanel .canvas-group-heading{padding-left:16px;border-left:1px solid transparent}

/* Four Test states: labels stay neutral; the icon carries the semantic color. */
#drawer .test-step{display:grid;grid-template-columns:16px minmax(0,1fr) auto;align-items:center;gap:16px;padding:8px 0;min-height:40px;color:#525F6B;font-size:12px;line-height:18px}
#drawer .test-step small{margin:0;font-size:12px;line-height:18px;font-weight:400;color:#525F6B;white-space:nowrap}
.test-step-symbol{box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:16px;height:16px;flex:0 0 16px;border-radius:50%;font:700 12px/16px sans-serif;color:#FFFFFF}
.test-step.completed .test-step-symbol{background:#00884A;border:0}
.test-step.failed .test-step-symbol{background:#ED0007;border:0}
.test-step.pending .test-step-symbol{background:#FFCF00;border:0}
.test-step.running .test-step-symbol{background:transparent;border:2px solid #00884A;border-top-color:transparent;animation:test-progress-spin .8s linear infinite}
@keyframes test-progress-spin{to{transform:rotate(360deg)}}
/* Remove stacked 48px heading shells: one 16px gap at each grouping boundary. */
#designPanel .summary-result-content:has(.instruction-global-actions){padding:16px 0}
#designPanel .instruction-global-actions{position:relative;display:flex;align-items:center;min-height:48px;height:48px;padding:0 16px;margin:0 0 16px;gap:16px}
#designPanel .instruction-global-actions h3{min-height:0;margin:0;line-height:24px}
#designPanel .grouped-steps{display:flex;flex-direction:column;gap:16px;padding:0;margin:0}
#designPanel .steps-group{padding:0;margin:0}
#designPanel .instruction-group-heading{display:block;min-height:0;height:auto;padding:0 16px;margin:0}
#designPanel .instruction-group-heading h3{display:block;min-height:0;height:auto;margin:0;padding:0;font-size:16px;line-height:24px}
#designPanel .instruction-row{min-height:0;height:auto;padding:16px;gap:16px;line-height:24px}
#designPanel .instruction-step{margin:0;padding:0}
#designPanel .step-detail-fields{margin:0;padding:16px;gap:16px}

/* Record media are collected by file type, with source shown in filenames. */
#designPanel .recording-videos,#designPanel .recording-media>.recording-screenshots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
#designPanel .recording-media video,#designPanel .recording-screenshot-file img{width:100%;aspect-ratio:16/9;max-height:none;object-fit:contain}
#designPanel .recording-media-name,#designPanel .recording-screenshot-file span{text-align:center}
@media(max-width:767px){#designPanel .recording-videos,#designPanel .recording-media>.recording-screenshots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:479px){#designPanel .recording-videos,#designPanel .recording-media>.recording-screenshots{grid-template-columns:minmax(0,1fr)}}

/* Align the footer separator with the content's 16px right inset. */
#drawer .drawer-footer{position:relative;border-top:0}
#drawer .drawer-footer:before{content:'';position:absolute;top:0;left:0;right:16px;height:1px;background:var(--line);pointer-events:none}

/* One centered content frame with equal 16px side spacing. */
html{scrollbar-gutter:auto}
.main{padding-left:16px;padding-right:16px}
.pagination{padding-left:16px;padding-right:16px}

/* Drawer sections share the same 16px frame on both sides. */
#drawer .drawer-head,#drawer .drawer-tabs,#drawer .drawer-body,#drawer .drawer-footer{padding-left:16px;padding-right:16px;min-width:0}
#drawer .drawer-tabs:after{left:16px;right:16px}
#drawer .drawer-footer:before{left:16px;right:16px}

/* Let only the AI entry reach the Drawer edge beyond the 16px content frame. */
#drawer #designPanel{overflow:clip;overflow-clip-margin:16px}
#drawer #designPanel .ai-dock{right:-16px}

#summarizeRecordings{padding-left:8px;padding-right:8px}

/* Independent Design columns share one row and the same bottom edge. */
#drawer #designPanel{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);column-gap:8px}
#drawer.ai-open #designPanel{grid-template-columns:minmax(0,1fr) minmax(0,var(--assistant-width,320px));padding-right:16px}
#drawer #designPanel>.recording-layout{grid-column:1;grid-row:1;min-width:0;min-height:0;height:100%;grid-template-columns:minmax(0,var(--recording-list-width,298px)) 17px minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:0}
#drawer #designPanel .workspace-splitter{display:block;width:17px}
#drawer #designPanel .workspace-splitter:after{left:8px}
#drawer #designPanel>.recording-assistant{position:relative;inset:auto;grid-column:2;grid-row:1;align-self:stretch;width:auto;height:auto;min-width:0;min-height:0;overflow:hidden}
#drawer #designPanel .recording-browser,#drawer #designPanel .recording-results{min-height:0;min-width:0}
#drawer #designPanel .assistant-width-resizer{left:0;width:8px}

/* Each divider has 8px of clear space on both sides. */
#drawer #designPanel .assistant-header,#drawer #designPanel .assistant-steps,#drawer #designPanel .assistant-chat,#drawer #designPanel .assistant-composer{padding-left:8px}
/* Pane actions meet the same bottom baseline as the AI input. */
#drawer #designPanel .recording-actions{padding-right:0;padding-bottom:0}
#drawer #designPanel .summary-result-content.reference-active,#drawer #designPanel .summary-result-content.metric-active{padding-bottom:0}

/* Recording and Test browsers meet the shared 8px divider inset. */
#drawer #designPanel .recording-browser{padding-right:0}
#drawer #designPanel .summary-result-content.test-active{padding-right:0}
/* AI contents share the full right edge; the close glyph follows that edge. */
#drawer #designPanel .assistant-header,#drawer #designPanel .assistant-steps,#drawer #designPanel .assistant-chat,#drawer #designPanel .assistant-composer{padding-right:0}
#drawer #designPanel .assistant-close{justify-content:flex-end}
#drawer #designPanel .assistant-steps{padding-top:8px;padding-bottom:0}
#drawer #designPanel .assistant-composer{padding-top:8px}
#drawer #designPanel .assistant-group-options{padding-top:8px;gap:8px}
#drawer #designPanel .assistant-group-insert{padding-top:0;padding-bottom:0;gap:8px}
/* Context options sit directly above the composer, after the chat area. */
#drawer #designPanel .has-group-context .assistant-header{order:0}
#drawer #designPanel .has-group-context .assistant-chat{order:1}
#drawer #designPanel .has-group-context .assistant-steps{order:2;padding-top:0}
#drawer #designPanel .has-group-context .assistant-composer{order:3}
#drawer #designPanel .test-progress-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#drawer #designPanel .test-step{padding-top:0;padding-bottom:0;min-height:24px}

/* The assistant body grows upward above the fixed input and scrolls as one area. */
#drawer #designPanel .assistant-content{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px;scrollbar-width:thin}
#drawer #designPanel .assistant-content .assistant-chat{order:0;flex:0 0 auto;margin-top:auto;padding-top:0;padding-bottom:0;overflow:visible;display:flex;flex-direction:column;gap:8px}
#drawer #designPanel .assistant-content .assistant-message{margin:0;flex-shrink:0}
#drawer #designPanel .assistant-content .assistant-steps{order:1;flex:0 0 auto;padding-top:0;padding-bottom:0}
#drawer #designPanel .assistant-content .assistant-step{margin:0;padding-top:0;padding-bottom:0;min-height:24px}
#drawer #designPanel .assistant-steps:not(:has(.assistant-group-options,.test-progress-heading)){display:flex;flex-direction:column;gap:8px}
#drawer #designPanel .assistant-steps:empty{display:none}
#drawer #designPanel .assistant-group-options>button{justify-content:flex-start;gap:16px;font:400 16px/24px var(--font-ui);text-align:left}
#drawer #designPanel .assistant-group-options>button>span:first-child{flex:0 0 16px}
#drawer #designPanel .assistant-group-options:not(:first-child){padding-top:8px}
#drawer #designPanel .assistant-group-options:first-child{padding-top:0}
.process-canvas{cursor:default}.process-canvas.panning{cursor:grabbing}

/* Guidance and process progress start at the top; choices stay above the input. */
#drawer #designPanel .has-top-content .assistant-content .assistant-steps{order:0}
#drawer #designPanel .has-top-content .assistant-content .assistant-chat{order:1;margin-top:0}
#drawer #designPanel .has-top-content .assistant-content{justify-content:flex-start}

/* Record filenames stay on one line; screenshots open in an image viewer. */
#designPanel .recording-media-name,#designPanel .recording-screenshot-file span{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#designPanel .recording-screenshot-file{min-width:0;cursor:zoom-in}
.record-image-preview{width:min(1280px,calc(100vw - 32px));max-width:calc(100vw - 32px);max-height:calc(100dvh - 32px);padding:16px;border:1px solid #D7DEE7;background:#fff;overflow:auto}
.record-image-preview::backdrop{background:rgba(0,0,0,.65)}
.record-image-preview>.assistant-close{margin-left:auto}
.record-image-preview figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.record-image-preview img{display:block;width:100%;height:auto;max-height:calc(100dvh - 152px);object-fit:contain}
.record-image-preview figcaption{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font:400 16px/24px var(--font-ui)}

/* Material generation: welcome/progress and dialogue at top, choices at bottom. */
#drawer #designPanel .assistant-intro{order:-1;flex:0 0 auto;padding-left:8px}
#drawer #designPanel .has-material-context .assistant-content .assistant-chat{margin-top:0;order:0}
#drawer #designPanel .has-material-context .assistant-content .assistant-steps{margin-top:auto;order:1}
#drawer #designPanel .assistant-intro .assistant-message{margin:0}
#drawer #designPanel .assistant-intro .test-step{grid-template-columns:16px minmax(0,1fr) auto;gap:8px}

#drawer #designPanel .has-material-context>.assistant-steps{order:0;margin:0;flex:0 0 auto;padding-top:8px;padding-bottom:0}

/* Node greeting and its options form one top-aligned block. */
#drawer #designPanel .has-group-context .assistant-content .assistant-steps{order:0;margin:0}
#drawer #designPanel .has-group-context .assistant-content .assistant-chat{order:1;margin-top:0}
#drawer #designPanel .assistant-group-name{border:0;min-height:24px;height:auto;padding:0;line-height:24px}
/* Shared 48px transparent rows, separated by the same neutral rule. */
#drawer #designPanel .assistant-group-options>button,
#drawer #designPanel .assistant-group-options>button:hover,
#drawer #designPanel .assistant-group-options>button:active,
#drawer #designPanel .assistant-content .assistant-step,
#drawer #designPanel .test-step{height:48px;min-height:48px;max-height:48px;flex-shrink:0;background:transparent;border:0;border-bottom:1px solid #D7DEE7;box-sizing:border-box}
#drawer #designPanel .assistant-content .assistant-step{align-items:center;overflow:hidden}
#drawer #designPanel .assistant-step-text{min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
#drawer #designPanel .assistant-group-options{gap:8px}

/* Neutral assistant heading; retain the established geometry and insets. */
#drawer #designPanel .assistant-header{background:transparent;color:#000;border-bottom:1px solid #D7DEE7}
#drawer #designPanel .assistant-header .assistant-close,
#drawer #designPanel .assistant-header .assistant-close:hover,
#drawer #designPanel .assistant-header .assistant-close:active{color:#595E62;background:transparent}
/* Generation choices follow the greeting at the top, within the scroll body. */
#drawer #designPanel .has-material-context .assistant-content .assistant-steps{order:0;margin-top:0}
#drawer #designPanel .has-material-context .assistant-content .assistant-chat{order:1;margin-top:0}
/* Step labels flow inline with their text and wrap at the content edge. */
#drawer #designPanel .assistant-step-text{display:block;white-space:normal;overflow-wrap:break-word;-webkit-line-clamp:unset}

/* Same 24px artwork and existing button footprint as Send. */
#drawer #designPanel .assistant-send.is-stopping svg{width:24px;height:24px;stroke:none}
#drawer #designPanel .assistant-send.is-stopping{color:#007BC0;background:transparent}
/* Automated steps use the existing selection tint; manual steps retain their fill. */
#drawer #designPanel .canvas-step:has(.execution-mode-icon[aria-label="Automated"]){background:#E6F1FF}

/* Header metric stays inside the existing 16px frame and 68px header. */
#drawer .automation-rate{width:192px;min-width:192px;height:48px;min-height:48px;flex:0 0 192px;display:flex;flex-direction:column;justify-content:space-between;background:#E6F1FF;padding:0 8px;box-sizing:border-box;font:400 16px/24px var(--font-ui);color:#000}
#drawer .automation-rate>span{align-self:flex-start;white-space:nowrap}
#drawer .automation-rate>output{align-self:flex-end;font:700 16px/24px var(--font-ui);color:#007BC0}

/* Input choices float above the existing button without changing its footprint. */
#drawer .input-action-wrapper{position:relative;flex:0 0 auto}
#drawer .input-menu{position:absolute;right:0;bottom:calc(100% + 8px);width:192px;padding:0;background:#fff;border:1px solid #D7DEE7;z-index:20}
#drawer .input-menu[hidden]{display:none}
#drawer .input-menu>button{display:block;width:100%;height:48px;padding:0 16px;text-align:left;background:transparent;border:0;font:400 16px/24px var(--font-ui);color:#000}
#drawer .input-menu>button+button{border-top:1px solid #D7DEE7}
#drawer .input-menu>button:hover,#drawer .input-menu>button:focus-visible{color:#007BC0;background:#E6F1FF}
#drawer #designPanel .execution-monitor{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;font:400 16px/24px var(--font-ui);color:#007BC0}
#drawer #designPanel .execution-monitor>div{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px}
#drawer #designPanel .execution-monitor>div>span:last-child{white-space:nowrap;text-align:right}

#drawer #designPanel .execution-monitor[hidden]{display:none}

<script>
'use strict';
// Scope: Flow list, Profile and the supplied four-state Design recording UI.
// Category/Service Level catalogs, Validation and remote services are not supplied.
// SVG assets are embedded from provided files.
const rowIcons={"edit": "<svg xmlns=\"http://www.w3.org/2000/svg\" xml:space=\"preserve\" viewBox=\"0 0 192 192\" class=\"icon\" aria-hidden=\"true\" focusable=\"false\" fill=\"currentColor\"><path d=\"M16 148h40v8H16zm154.85-70.65-2.829 2.828-.021-.021-65.955 65.955-39.543 9.886 9.886-39.543 68.763-68.805c8.187-8.187 21.51-8.187 29.698 0 8.188 8.189 8.188 21.511 0 29.7M100 136.842l54.35-54.35-18.301-18.385L81.657 118.5zm-26.502 8.16 18.678-4.67-14.009-14.009zm91.694-91.696c-4.858-4.859-12.638-5.06-17.74-.603l-5.747 5.747 18.301 18.386 5.79-5.79c4.456-5.1 4.255-12.88-.604-17.74\" /></svg>", "delete": "<svg xmlns=\"http://www.w3.org/2000/svg\" xml:space=\"preserve\" viewBox=\"0 0 192 192\" class=\"icon\" aria-hidden=\"true\" focusable=\"false\" fill=\"currentColor\"><path d=\"M152 56H40V40h112zm-12 104c0 4.411-3.59 8-8 8H60c-4.412 0-8-3.589-8-8V64h16v56h8V64h16v56h8V64h16v56h8V64h16zM80 24h32c4.411 0 8 3.588 8 8H72c0-4.412 3.589-8 8-8m80 8h-32c0-8.822-7.178-16-16-16H80c-8.823 0-16 7.178-16 16H32v32h12v96c0 8.822 7.178 16 16 16h72c8.822 0 16-7.178 16-16V64h12z\" /></svg>", "run": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 4 19 12 6 20Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\"/></svg>"};
function semanticVersion(value){if(/^v\d+\.\d+\.\d+$/.test(value))return value;return 'v'+(String(value).match(/\d+/)?.[0]||'1')+'.0.0';}
const flowData=[{"code": "TASKFLOW-001", "name": "Bosch 间接采购 · 年度设施维护", "description": "仅操作本地构建的 Bosch 场景静态演示。核验供应商主数据，创建需求草稿，比较报价并完成三单匹配。每个关键节点保存审计记录，遇到缺失字段时暂停并请求人工确认。", "version": "r2", "status": "Ready", "category": "采购"}, {"code": "TASKFLOW-002", "name": "采购04｜逾期巡检（待修复）", "description": "检查采购订单到货日期与当前状态，识别逾期订单并输出巡检清单。当前模板仍需人工核对。", "version": "r3", "status": "Review", "category": "采购"}, {"code": "TASKFLOW-003", "name": "采购03｜采购草稿创建与人工接管", "description": "在演示系统中创建采购订单草稿。按供应商名称和物料编码查找匹配记录，填写数量、单价和到货日期。保存后核对订单金额，不执行审批、到货或开票动作。", "version": "r3", "status": "Ready", "category": "采购"}, {"code": "TASKFLOW-004", "name": "采购01｜供应商档案巡检（待修复）", "description": "核对供应商档案完整性与资质有效期，标记需要补充的信息，形成巡检结果。", "version": "r3", "status": "Review", "category": "采购"}, {"code": "TASKFLOW-005", "name": "采购02｜物料替代与缺失信息检查", "description": "查找目标物料，检查计量单位、价格与可用库存，将缺失信息整理为清单。", "version": "r1", "status": "Ready", "category": "采购"}, {"code": "TASKFLOW-006", "name": "百度搜索", "description": "在百度搜索指定关键词，识别自然搜索结果，整理标题和摘要。此 Demo 仅模拟浏览器执行过程。", "version": "r1", "status": "Ready", "category": "信息检索"}, {"code": "TASKFLOW-007", "name": "采购05｜订单与到货记录交叉核对", "description": "交叉核对采购订单、到货记录与发票信息，输出匹配结果和差异说明。", "version": "r1", "status": "Ready", "category": "采购"}, {"code": "TASKFLOW-008", "name": "创建采购项目", "description": "在演示采购站点创建一个项目，填写项目名称、负责人及预计完成日期，并保存项目草稿。", "version": "r2", "status": "Ready", "category": "采购"}].map((flow,index)=>({...flow,version:semanticVersion(flow.version),enabled:index!==0,versions:[{name:semanticVersion(flow.version),enabled:index!==0}]}));
const $=id=>{const root=document.querySelector('#designPanel > .recording-layout:not([hidden])');return (root&&[...root.querySelectorAll('#'+CSS.escape(id))].find(element=>!element.closest('[hidden]')))||document.getElementById(id);};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let appliedName='',appliedVersion='';
let appliedSearch='',activeStatus='All',currentFlow=null,trigger=null,initialName='',savedScroll=0;
const profileDrafts=new Map();
const savedProfileKey='taskflow-saved-profiles-v1';
let savedProfiles={};try{const value=JSON.parse(localStorage.getItem(savedProfileKey)||'{}');if(value&&typeof value==='object'&&!Array.isArray(value))savedProfiles=value;}catch{}
for(const [code,saved] of Object.entries(savedProfiles)){if(!/^TASKFLOW-\d+$/.test(code)||!saved||typeof saved.name!=='string'||typeof saved.description!=='string'||!Array.isArray(saved.versions))continue;const existing=flowData.find(flow=>flow.code===code);if(existing)Object.assign(existing,saved);else flowData.push({...saved,code,category:saved.category||'',status:saved.status||'Ready'});}
for(const flow of flowData){flow.version=semanticVersion(flow.version);flow.versions=flow.versions.map(v=>({...v,name:semanticVersion(v.name)}));}
function nextTaskflowCode(){return 'TASKFLOW-'+String(Math.max(0,...flowData.map(flow=>Number(flow.code.match(/\d+$/)?.[0])||0))+1).padStart(3,'0');}
function saveProfile(){if(!validateProfileServices())return;const draft=profileDraft(),code=currentFlow?.code||nextTaskflowCode(),snapshot={code,name:$('flowName').value.trim(),description:$('flowDescription').value.trim(),serviceLines:[...draft.serviceLines],versions:draft.versions.map(version=>({...version})),enabled:draft.versions.some(version=>version.enabled),version:draft.versions[0]?.name||'v1.0.0',category:currentFlow?.category||'',status:currentFlow?.status||'Ready'};try{localStorage.setItem(savedProfileKey,JSON.stringify({...savedProfiles,[code]:snapshot}));}catch{$('profileSaveStatus').textContent='Unable to save. Please try again.';return;}savedProfiles[code]=snapshot;if(currentFlow)Object.assign(currentFlow,snapshot);else{currentFlow=snapshot;flowData.push(currentFlow);profileDrafts.set(code,draft);profileDrafts.delete('new');activeFlowKey=code;}$('drawerTitle').textContent=code.replace('TASKFLOW','Taskflow');draft.name=snapshot.name;draft.description=snapshot.description;render();$('profileSaveStatus').textContent='Saved.';}

function profileDraft(){const key=currentFlow?.code||'new';if(!profileDrafts.has(key))profileDrafts.set(key,{name:currentFlow?.name||'',description:currentFlow?.description||'',serviceLines:[...(currentFlow?.serviceLines||['','','',''])],versions:(currentFlow?.versions||[{name:'v1.0.0',enabled:false}]).map(version=>({...version}))});return profileDrafts.get(key);}
function renderVersionManagement(){const draft=profileDraft();$('versionManagementRows').innerHTML=draft.versions.map((version,index)=>`<div class="version-management-row"><div class="field version-value-field"><label class="field-label" for="${index===0?'flowVersion':'flowVersion'+index}">Version</label><div class="version-status-field"><select id="${index===0?'flowVersion':'flowVersion'+index}" data-version-name="${index}" aria-label="Version"><option value="">Please select</option>${[...new Set([version.name,...(currentFlow?.versions||[]).map(v=>v.name)])].filter(Boolean).map(name=>`<option ${name===version.name?'selected':''}>${escapeHTML(name)}</option>`).join('')}</select><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></div></div><div class="field version-state-field"><label class="field-label" for="${index===0?'flowStatus':'flowStatus'+index}">Status</label><div class="version-status-field"><select id="${index===0?'flowStatus':'flowStatus'+index}" data-version-index="${index}" aria-label="Status"><option value="">Please select</option><option value="Active" ${version.enabled===true?'selected':''}>Active</option><option value="Deactive" ${version.enabled===false?'selected':''}>Deactive</option></select><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></div></div></div>`).join('');installSelectClears();}
function installSelectClears(){document.querySelectorAll('#profilePanel select').forEach(select=>{const host=select.parentElement;if(host.querySelector('.select-clear'))return;const button=document.createElement('button');button.type='button';button.className='select-clear';button.setAttribute('aria-label','Clear '+select.getAttribute('aria-label'));button.title='Clear';button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>';button.onclick=e=>{e.preventDefault();e.stopPropagation();select.value='';select.dispatchEvent(new Event('change',{bubbles:true}));select.focus();};host.appendChild(button);});}

function commitVersionStatus(index,value){const draft=profileDraft();draft.versions[index].enabled=value===''?null:value==='Active';if(currentFlow){currentFlow.versions=draft.versions.map(version=>({...version}));currentFlow.enabled=currentFlow.versions.some(version=>version.enabled);render();}}
function rowIcon(name,code,disabled=false){return `<button type="button" class="icon-button" aria-label="${name[0].toUpperCase()+name.slice(1)} ${code}" title="${name[0].toUpperCase()+name.slice(1)}" data-action="${name}" data-code="${code}" ${disabled?'disabled':''}>${rowIcons[name]}</button>`;}
function render(){const rows=flowData.filter(f=>(!appliedSearch||(f.code+' '+f.name+' '+f.description).toLowerCase().includes(appliedSearch))&&(!appliedName||f.name.toLowerCase().includes(appliedName))&&(!appliedVersion||f.version.toLowerCase().includes(appliedVersion))&&(activeStatus==='All'||(activeStatus==='Active'?f.enabled:!f.enabled)));$('flowRows').innerHTML=rows.map(f=>`<tr><td><a class="code-link" href="#${f.code}" data-open="${f.code}">${f.code}</a></td><td>${escapeHTML(f.name)}</td><td><span class="flow-description" title="${escapeHTML(f.description)}">${escapeHTML(f.description)}</span></td><td>${escapeHTML(f.version)}</td><td><span class="flow-enabled ${f.enabled?'active':'deactive'}"><span class="flow-status-dot" aria-hidden="true"></span>${f.enabled?'Active':'Deactive'}</span></td><td class="action-cell"><div class="row-actions">${rowIcon('edit',f.code)}${rowIcon('run',f.code,true)}${rowIcon('delete',f.code,true)}</div></td></tr>`).join('')||'<tr><td class="empty" colspan="6">No matching flows.</td></tr>';$('range').textContent=rows.length?`1–${rows.length} of ${rows.length} items`:'0–0 of 0 items';$('currentPage').disabled=!rows.length;document.querySelectorAll('[data-status]').forEach(b=>{const active=b.dataset.status===activeStatus;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;});}
function openDrawer(code,source){currentFlow=code?flowData.find(f=>f.code===code):null;trigger=source;savedScroll=window.scrollY;$('drawerTitle').textContent=code?code.replace('TASKFLOW','Taskflow'):nextTaskflowCode().replace('TASKFLOW','Taskflow');$('profileSaveStatus').textContent='';const draft=profileDraft();$('flowName').value=draft.name;$('flowDescription').value=draft.description;initialName=draft.name;renderVersionManagement();document.querySelectorAll('[data-service-index]').forEach(select=>select.value=draft.serviceLines[Number(select.dataset.serviceIndex)]||'');closePopup('category');closePopup('service');initializeDrawerRecording(code);$('drawer').showModal();document.body.style.overflow='hidden';$('flowName').focus({preventScroll:true});}
async function closeDrawer(recordingConfirmed=false){const session=recordingSession();if(session.stage==='recording'){if(!recordingConfirmed&&!window.confirm('Stop recording and close?'))return;await finishBrowserRecording();}const draft=profileDraft();draft.name=$('flowName').value;draft.description=$('flowDescription').value;closePopup('service');recordingSession().aiOpen=false;renderAIPanel();$('drawer').close();document.body.style.overflow='';window.scrollTo({top:savedScroll,behavior:'instant'});trigger?.focus({preventScroll:true});}
function closePopup(type){const popup=$(type==='category'?'categoryPopup':'servicePopup');const button=$(type==='category'?'category':'serviceLine');if(popup)popup.hidden=true;if(button&&popup)button.setAttribute('aria-expanded','false');}
function togglePopup(type){const popup=$(type==='category'?'categoryPopup':'servicePopup');const button=$(type==='category'?'category':'serviceLine');const willOpen=popup.hidden;popup.hidden=!willOpen;button.setAttribute('aria-expanded',String(willOpen));if(willOpen)$(type==='category'?'categorySearch':'serviceSearch').focus();}
$('toggleNav').onclick=()=>{const open=$('shell').classList.toggle('expanded');$('toggleNav').setAttribute('aria-expanded',String(open));$('toggleNav').setAttribute('aria-label',open?'Collapse navigation':'Expand navigation');$('toggleNav').title=open?'Collapse navigation':'Expand navigation';};
function updateFilterExpansion(){const button=$('expandFilters'),expanded=!$('advancedFilters').hidden,count=Number(!!appliedName)+Number(!!appliedVersion),label=expanded?'Collapse':'Expand';button.setAttribute('aria-expanded',String(expanded));button.setAttribute('aria-label',label);button.title=label;button.dataset.copyKey=expanded?'filter.action.collapse':'filter.action.expand';button.querySelector('span').textContent=label;button.dataset.activeCount=!expanded&&count?String(count):'';}
$('expandFilters').onclick=()=>{$('advancedFilters').hidden=!$('advancedFilters').hidden;updateFilterExpansion();};
$('query').onsubmit=e=>{e.preventDefault();appliedSearch=$('search').value.trim().toLowerCase();appliedName=$('filterName').value.trim().toLowerCase();appliedVersion=$('filterVersion').value.trim().toLowerCase();closePopup('category');render();updateFilterExpansion();};
$('reset').onclick=()=>{$('search').value='';$('filterName').value='';$('filterVersion').value='';appliedSearch='';appliedName='';appliedVersion='';activeStatus='All';$('categorySearch').value='';closePopup('category');render();updateFilterExpansion();};
document.querySelectorAll('[data-status]').forEach(b=>{b.onclick=()=>{activeStatus=b.dataset.status;render();};b.onkeydown=e=>{const tabs=[...document.querySelectorAll('[data-status]')];let index=tabs.indexOf(b);if(e.key==='ArrowRight')index=(index+1)%tabs.length;else if(e.key==='ArrowLeft')index=(index+tabs.length-1)%tabs.length;else if(e.key==='Home')index=0;else if(e.key==='End')index=tabs.length-1;else return;e.preventDefault();tabs[index].click();tabs[index].focus();};});
$('flowRows').onclick=e=>{const link=e.target.closest('[data-open]');const edit=e.target.closest('[data-action="edit"]');if(link){e.preventDefault();openDrawer(link.dataset.open,link);}else if(edit)openDrawer(edit.dataset.code,edit);};
$('create').onclick=e=>openDrawer(null,e.currentTarget);
$('close').onclick=async()=>{if(await confirmWorkspaceAction(recordingSession().stage==='recording'?'Stop recording and close?':'Close this taskflow?'))await closeDrawer(true);};$('profileSave').onclick=saveProfile;$('profilePanel').addEventListener('input',()=>{$('profileSaveStatus').textContent='';});
$('flowName').oninput=e=>{e.target.setCustomValidity('');profileDraft().name=e.target.value;};$('flowDescription').oninput=e=>{e.target.setCustomValidity('');profileDraft().description=e.target.value;};
$('versionManagementRows').onchange=e=>{if(e.target.matches('[data-version-name]'))profileDraft().versions[Number(e.target.dataset.versionName)].name=e.target.value;if(e.target.matches('[data-version-index]'))commitVersionStatus(Number(e.target.dataset.versionIndex),e.target.value);};
$('drawer').addEventListener('cancel',e=>{e.preventDefault();closeDrawer();});
$('category').onclick=()=>togglePopup('category');document.querySelectorAll('[data-service-index]').forEach(control=>{const save=()=>{control.setCustomValidity('');profileDraft().serviceLines[Number(control.dataset.serviceIndex)]=control.value;};control.oninput=save;control.onchange=save;});
for(const type of ['category']){$(type==='category'?'categorySearch':'serviceSearch').onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closePopup(type);$(type==='category'?'category':'serviceLine').focus();}};}

 const video=(media,name)=>`<div class="recording-video"><video controls playsinline preload="metadata" aria-label="${escapeHTML(name)}" ${media.videoURL?`src="${escapeHTML(media.videoURL)}"`:''} ${media.screenshots?.[0]?`poster="${media.screenshots[0].image}"`:''}></video><div class="recording-media-name" title="${escapeHTML(name)}">${media.videoURL?`<a href="${escapeHTML(media.videoURL)}" download="${escapeHTML(name)}">${escapeHTML(name)}</a>`:escapeHTML(name)}</div></div>`;
 const sources=[{media:original,name:base+'-original',original:true},...runs.map((media,index)=>({media,name:base+'-test '+String(index+1).padStart(2,'0')}))];
 const screenshots=sources.flatMap(({media,name:prefix,original})=>(media.screenshots||[]).map((file,index)=>{const name=prefix+'-'+String(index+1).padStart(2,'0')+'.png';return `<a class="recording-screenshot-file" data-image-preview href="${file.image}" download="${escapeHTML(name)}"><img src="${file.image}" alt="${escapeHTML(name)}"><span title="${escapeHTML(name)}">${escapeHTML(name)}</span></a>`;}));
 return `<div class="recording-media"><div class="recording-videos">${sources.map(({media,name,original})=>video(media,name+(original?'-01':'')+'.webm')).join('')}</div>${screenshots.length?`<div class="recording-screenshots">${screenshots.join('')}</div>`:''}</div>`;
};
function bindRecordingImagePreview(){
 const panel=$('summaryResultPanel');if(!panel?.querySelector('[data-image-preview]'))return;
 panel.onclick=e=>{const link=e.target.closest('[data-image-preview]');if(!link||e.ctrlKey||e.metaKey)return;e.preventDefault();const dialog=$('recordImagePreview');dialog.querySelector('img').src=link.href;dialog.querySelector('img').alt=link.download;dialog.querySelector('figcaption').textContent=link.download;dialog.showModal();dialog.querySelector('button').focus();};
 const dialog=$('recordImagePreview');dialog.querySelector('button').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close();};
}

// Native pointer and keyboard resizing. No layout labels or icons are added.
let workspaceResizeObserver;
function workspaceSplitterMarkup(){return '<div class="workspace-splitter" id="workspaceSplitter" role="separator" aria-label="Browser width" aria-orientation="vertical" tabindex="0"></div>';}
function workspaceWidthBounds(layout){const total=layout.getBoundingClientRect().width;return {min:298,max:Math.max(298,total-17-320)};}
function setWorkspaceWidth(value){
 const layout=$('designPanel').querySelector('.recording-layout:not([hidden])'),separator=$('workspaceSplitter');if(!layout||!separator)return;
 const limits=workspaceWidthBounds(layout),width=Math.max(limits.min,Math.min(limits.max,value));
 recordingSession().listWidth=width;layout.style.setProperty('--recording-list-width',width+'px');
 separator.setAttribute('aria-valuemin',String(limits.min));separator.setAttribute('aria-valuemax',String(Math.round(limits.max)));separator.setAttribute('aria-valuenow',String(Math.round(width)));
}
function bindWorkspaceResize(){
 workspaceResizeObserver?.disconnect();const layout=$('designPanel').querySelector('.recording-layout:not([hidden])'),separator=$('workspaceSplitter');if(!layout||!separator)return;
 const state=recordingSession();if(state.listWidth)setWorkspaceWidth(state.listWidth);
 const refresh=()=>{if(getComputedStyle(separator).display==='none')return;const width=state.listWidth??layout.querySelector('.recording-list').getBoundingClientRect().width;setWorkspaceWidth(width);};
 workspaceResizeObserver=new ResizeObserver(refresh);workspaceResizeObserver.observe(layout);refresh();
 separator.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();separator.setPointerCapture(e.pointerId);document.body.classList.add('workspace-resizing');};
 separator.onpointermove=e=>{if(separator.hasPointerCapture(e.pointerId))setWorkspaceWidth(e.clientX-layout.getBoundingClientRect().left);};
 const finish=e=>{if(separator.hasPointerCapture(e.pointerId))separator.releasePointerCapture(e.pointerId);document.body.classList.remove('workspace-resizing');};
 separator.onpointerup=finish;separator.onpointercancel=finish;
 separator.onkeydown=e=>{const current=layout.querySelector('.recording-list').getBoundingClientRect().width,limits=workspaceWidthBounds(layout);let next;if(e.key==='ArrowLeft')next=current-24;else if(e.key==='ArrowRight')next=current+24;else if(e.key==='Home')next=limits.min;else if(e.key==='End')next=limits.max;else return;e.preventDefault();setWorkspaceWidth(next);};
}
function assistantWidthBounds(){return {min:Math.min(260,Math.max(180,innerWidth*.35)),max:Math.max(260,Math.min(640,innerWidth-48-700))};}
function setAssistantWidth(value){
 const bounds=assistantWidthBounds(),width=Math.max(bounds.min,Math.min(bounds.max,value));recordingSession().aiWidth=width;$('drawer').style.setProperty('--assistant-width',width+'px');
 const separator=$('assistantResize');separator.setAttribute('aria-valuemin',String(Math.round(bounds.min)));separator.setAttribute('aria-valuemax',String(Math.round(bounds.max)));separator.setAttribute('aria-valuenow',String(Math.round(width)));
}
function bindAssistantResize(){
 const separator=$('assistantResize');setAssistantWidth(recordingSession().aiWidth||384);
 separator.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();separator.setPointerCapture(e.pointerId);document.body.classList.add('workspace-resizing');};
 separator.onpointermove=e=>{if(separator.hasPointerCapture(e.pointerId))setAssistantWidth($('recordingAssistant').getBoundingClientRect().right-e.clientX);};
 const finish=e=>{if(separator.hasPointerCapture(e.pointerId))separator.releasePointerCapture(e.pointerId);document.body.classList.remove('workspace-resizing');};
 separator.onpointerup=finish;separator.onpointercancel=finish;
 separator.onkeydown=e=>{let value=recordingSession().aiWidth||384;const bounds=assistantWidthBounds();if(e.key==='ArrowLeft')value+=24;else if(e.key==='ArrowRight')value-=24;else if(e.key==='Home')value=bounds.min;else if(e.key==='End')value=bounds.max;else return;e.preventDefault();setAssistantWidth(value);};
}

render();
</script>
